# Build + publish the interpose-sandbox AGENT IMAGE (rootfs with the interpose
# enforcer + vsock guest-agent + node + pi baked in) as an OCI image, for both
# arches, on a version tag.
#
# REQUIRED GitHub setup (see repo settings → Secrets and variables → Actions):
#   Secrets:
#     DOCKERHUB_USERNAME       — registry user (the `startaworldpeace` account)
#     SANDBOX_DOCKERHUB_TOKEN  — a Docker Hub access token with push rights
#     INTERPOSE_REPO_TOKEN     — a PAT that can read the interposed/interpose repo
#                              (only if that repo is private; drop the token line
#                               below if it's public)
#   And create the Docker Hub repo `startaworldpeace/interpose-agent` first.
name: agent-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: image version tag (e.g. v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Checkout interpose-sandbox
        uses: actions/checkout@v4
        with:
          path: interpose-sandbox

      - name: Checkout interpose (for the enforcer binary)
        uses: actions/checkout@v4
        with:
          repository: interposed/interpose
          path: _interpose
          token: ${{ secrets.INTERPOSE_REPO_TOKEN }}

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Set up QEMU (cross-arch emulation for the ext4 build)
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Registry login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.SANDBOX_DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: v
        run: echo "version=${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}" >> "$GITHUB_OUTPUT"

      - name: Build + publish agent image (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          INTERPOSE_SRC: ${{ github.workspace }}/_interpose
          AGENT_TAG: startaworldpeace/interpose-agent:ubuntu-24.04-${{ matrix.arch }}-${{ steps.v.outputs.version }}
          PUBLISH: '1'
        working-directory: interpose-sandbox
        run: ./image/build.sh
